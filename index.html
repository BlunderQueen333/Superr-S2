<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupeRR Selector Season 2 – Top rated clutch players</title>
<style>
:root{color-scheme:light;--ink:#1c2b3a;--ink2:#5b6b7b;--line:#e3e9f0;--blue:#4a90d9;--blue2:#2a78d6;--card:#fff;--pos:#2e7d4f;--neg:#c0392b;--orange:#eb6834;--soft:#f2f6fb}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#e8f0fa 0,#f6f9fd 420px,#fbfcfe 100%);min-height:100vh}
main{max-width:1240px;margin:0 auto;padding:34px 20px 70px}h1{font-size:30px;margin:6px 0 8px;color:#1e3a5f;letter-spacing:-.3px}p.lead{color:var(--ink2);max-width:880px;margin:0 0 20px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 15px;border-radius:9px;cursor:pointer}
.seg button:hover{background:var(--soft)}.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--blue);color:#fff}
.bar{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar>label,.lab{color:var(--ink2);font-size:13px}.bar input[type=search],.bar select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;color:var(--ink)}
.bar input[type=search]{min-width:240px}details.info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:14px 0}details.info summary{cursor:pointer;font-weight:700}details.info p{color:var(--ink2);margin:8px 0 0}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px;overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--ink2);font-weight:600;text-align:right;padding:15px 14px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}th:nth-child(2),th:first-child{text-align:left}th:hover{color:var(--ink)}
td{padding:14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}td:nth-child(2),td:first-child{text-align:left}tr.r{cursor:pointer}tr.r:hover{background:#f7fafe}tr:last-child td{border-bottom:0}
td.rk{font-weight:700;color:var(--blue2);font-size:16px}.nm{font-weight:700}.sub{display:block;color:var(--ink2);font-size:12.5px;font-weight:400;max-width:430px;white-space:normal}.pos{color:var(--pos);font-weight:600}.neg{color:var(--neg);font-weight:600}.sc{font-weight:700}
.chip{display:inline-block;font-size:11px;color:var(--orange);border:1px solid #f6c9b6;border-radius:8px;padding:0 6px;margin-left:6px;font-weight:600;vertical-align:middle}.note{border-left:3px solid var(--orange);background:#fff;border-radius:0 12px 12px 0;padding:10px 16px;margin:12px 0;color:var(--ink2)}
.detail td{background:#f7fafe;text-align:left;white-space:normal;padding:16px 22px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
h2{font-size:17px;margin:26px 0 8px;color:#1e3a5f}small,.muted{color:var(--ink2)}svg text{fill:var(--ink2);font-size:11px}.mini table{font-size:13px}.mini th,.mini td{padding:6px 8px}.mini th{cursor:default}
.logo text{fill:#fff!important;font-size:21px!important}.brand{display:flex;align-items:center;gap:14px;margin:0 0 6px}.logo{height:88px;width:auto;flex:none}.subrow{display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap;margin-top:4px}.by{color:var(--ink2);font-size:14px}.by a{color:var(--blue2);text-decoration:none}.by a:hover{text-decoration:underline}.brandname{font-size:26px;font-weight:800;color:#1e3a5f;letter-spacing:-.3px}h1{font-size:19px!important;font-weight:600;color:var(--ink2)!important;margin:0!important}.brand{margin-bottom:20px!important}footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink2);font-size:13px;text-align:center}footer a{color:var(--blue2);text-decoration:none}footer a:hover{text-decoration:underline}.tip{position:fixed;pointer-events:none;background:#1c2b3a;color:#fff;padding:5px 9px;border-radius:7px;font-size:12px;display:none;z-index:9}.cnt{color:var(--ink2);font-size:13px;margin:8px 2px}
</style></head><body><main>

 <div class="bar"><span class="lab">Years</span><label>from <select id="y0">${[2022,2023,2024,2025,2026].map(y=>`<option ${y===S.y0?'selected':''}>${y}</option>`).join('')}</select></label><label>to <select id="y1">${[2022,2023,2024,2025,2026].map(y=>`<option ${y===S.y1?'selected':''}>${y}</option>`).join('')}</select></label></div>
 <div class="bar">${posBtn}${bat?'':`<span class="lab">Type</span>${seg('pace',[['All','All'],['Pace','Pace'],['Spin','Spin']],S.pace)}`}<span class="lab">Show</span>${seg('show',[[10,'Top 10'],[30,'Top 30'],[0,'All']],S.show)}</div>
 <details class="info"><summary>What do these numbers mean?</summary><p><b>Clutch Meter</b>: 50 is the average eligible player; every 10 points is one standard deviation. It averages two pressure definitions (strict and broad) and is shrunk towards the average when the sample is small. <b>Top-10 chance</b>: share of 400 stress runs (resampled matches, perturbed weights, both pressure definitions) in which the player lands in the top 10 – the honest measure of how firm a rank is. <b>Pressure balls</b>: balls ${bat?'faced':'bowled'} in strict-pressure situations. <b>${bat?'SR under pressure':'Economy under pressure'}</b>: raw output in those balls. <b>${bat?'Impact vs expected':'Runs saved vs expected'}</b>: ${bat?'runs above what an average player in the same slot, partner, bowler and match state would score, per 100 balls':'runs per over saved compared with an average bowler in the same state'}. <b>Consistency</b>: share of the player’s pressure ${bat?'innings':'spells'} with positive impact. <b>Low-sample flag</b>: shown when a player has fewer than 10 pressure ${bat?'innings':'spells'} or fewer than ${bat?100:120} pressure ${bat?'balls':'deliveries'}; it names the reason (many balls can still come from very few innings). <b>#</b> is the player’s rank by Clutch Meter in the chosen window among all eligible players, whatever other filters are applied.</p></details>
 ${short?'<div class="note">Short windows contain little pressure data: most players carry a <b>low-sample flag</b> and their scores are pulled towards the average. Read these as provisional.</div>':''}
 ${S.lg!=='all'?`<div class="note">${S.lg==='ipl'?'IPL view':'International view'}: players are re-scored using only ${S.lg==='ipl'?'IPL':'T20I / non-IPL'} matches in the window, so it is performance in that league, not a filter of the overall list.</div>`:''}
 <div class="cnt">${nTot} of ${n} eligible ${bat?'batters':'bowlers'} match these filters · showing ${shown.length} · eligibility in this window: ≥${v&&v.minb||'–'} strict-pressure ${bat?'balls':'deliveries'} and ≥${v&&v.mini||'–'} ${bat?'innings':'spells'} · click a row for the breakdown</div>
 <div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${body||'<tr><td colspan="8" style="text-align:center;color:var(--ink2);padding:30px">No players match these filters in this window.</td></tr>'}</tbody></table></div>`}
function detail(kind,x){const bat=kind==='bat',p=x.p,d=D[kind];if(!p.blocks)return '<span class="muted">Detailed breakdown is available for players eligible in the full 2022–26 window.</span>';const B=d.meta.blocks,mx=Math.max(.6,...p.blocks.map(Math.abs));
 const bl=B.map((b,i)=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="width:90px">${b}</span><svg width="240" height="12"><line x1="120" x2="120" y1="0" y2="12" stroke="#cfd8e2"/><rect x="${p.blocks[i]>=0?120:120+120*p.blocks[i]/mx}" width="${Math.abs(120*p.blocks[i]/mx)}" y="1" height="10" rx="3" fill="#4a90d9"/></svg><small>${p.blocks[i]>=0?'+':''}${p.blocks[i]}</small></div>`).join('');
 const st=s=>s?(bat?`${s.n} balls · SR ${s.sr} (expected ${s.esr}) · dot ${s.dot}% · boundary ${s.bnd}% · ${s.outs} outs · runs above expected/100: ${s.rae}`:`${s.balls} balls · econ ${s.econ} (expected ${s.eecon}) · dot ${s.dot}% (exp ${s.edot}) · boundary ${s.bnd}% (exp ${s.ebnd}) · ${s.wkts} wkts (exp ${s.ewk})`):'–';
 let ty='';if(bat&&p.types)ty='<div><b>By pressure type (all years)</b>'+Object.entries(p.types).map(([k,v])=>`<div class="muted">${k.replace('_',' ')}: ${st(v)}</div>`).join('')+'</div>';
 return `<div class="grid2"><div><b>Where the score comes from (all years 2022–26)</b><br><small>Weighted contribution of each block to the composite.</small>${bl}<small>Level = how good under pressure · Relief = early-overs ${bat?'platform':'pressure creation'} · Delta = pressure vs own usual level · Reliability = consistency · Tail = ${bat?'tail protection':'tail clean-up'}. Metrics with no repeatable signal are shrunk to zero.</small></div>
 <div><b>Under pressure (all years)</b><div class="muted">${st(p.press)}</div><b>Ordinary balls</b><div class="muted">${st(p.norm)}</div><br><small>All-years rank ${p.rank}, Clutch Meter ${p.score}, rank range ${p.rlo}–${p.rhi}.</small>${ty}</div></div>`}
function scatter(kind){const d=D[kind],bat=kind==='bat';const pl=d.players.filter(p=>p.elig&&p.press&&p.norm);const gx=p=>bat?p.norm.rae:p.norm.econ,gy=p=>bat?p.press.rae:p.press.econ;const xs=pl.map(gx),ys=pl.map(gy);const lo=Math.min(...xs,...ys),hi=Math.max(...xs,...ys),pad=(hi-lo)*.06;const L=lo-pad,Hh=hi+pad,w=430,h=380,m=44;const sx=v=>m+(v-L)/(Hh-L)*(w-m-10),sy=v=>h-m-(v-L)/(Hh-L)*(h-m-10);const top=new Set(pl.filter(p=>p.rank<=10).map(p=>p.id));
 const dots=pl.map(p=>`<circle cx="${sx(gx(p))}" cy="${sy(gy(p))}" r="${top.has(p.id)?5.5:3.5}" fill="${top.has(p.id)?'#2a78d6':'#7f8fa0'}" opacity="${top.has(p.id)?1:.5}" stroke="#fff" stroke-width="1.5" data-t="${p.name} (rank ${p.rank}): usual ${f(gx(p),bat?1:2)} · pressure ${f(gy(p),bat?1:2)}"/>`).join('');
 return `<b>${bat?'Batters: runs above expected per 100 balls':'Bowlers: economy'}</b><br><small>${bat?'Above the dashed line = better under pressure than usual':'Above the line = more expensive under pressure than usual (worse)'} · blue = final top 10</small><svg width="${w}" height="${h}"><line x1="${sx(L)}" y1="${sy(L)}" x2="${sx(Hh)}" y2="${sy(Hh)}" stroke="#eb6834" stroke-dasharray="5 4"/><line x1="${m}" x2="${m}" y1="10" y2="${h-m}" stroke="#cfd8e2"/><line x1="${m}" x2="${w-10}" y1="${h-m}" y2="${h-m}" stroke="#cfd8e2"/><text x="${w/2}" y="${h-8}" text-anchor="middle">usual (ordinary balls)</text><text transform="translate(12 ${h/2}) rotate(-90)" text-anchor="middle">under pressure</text>${dots}</svg>`}
function vs(){let h='<div class="grid2">';for(const k of ['bat','bowl']){const m=D[k].meta;const keys=Object.keys(m.tiers['Pressure (strict tier)']);h+=`<div class="card mini"><b>${k==='bat'?'Batters':'Bowlers'}: strict pressure tier vs ordinary balls</b><table><thead><tr><th style="text-align:left">Measure</th><th>Pressure</th><th>Ordinary</th></tr></thead><tbody>${keys.map(x=>`<tr><td style="text-align:left">${x}</td><td>${m.tiers['Pressure (strict tier)'][x]}</td><td>${m.tiers['Ordinary'][x]}</td></tr>`).join('')}</tbody></table></div>`}
 h+='</div><div class="note">For bowlers the strict tier is clearly harder (economy, boundaries and extras all worse). For batters it is defined by <i>stakes</i>: the win-probability swing per ball is almost 3× larger and the batting side wins far less often, but the dismissal rate barely moves – the data do not show a large behavioural drop.</div><div class="grid2"><div class="card">'+scatter('bat')+'</div><div class="card">'+scatter('bowl')+'</div></div><h2>Share of balls that are “pressure”, by over</h2><div class="grid2">'+['bat','bowl'].map(k=>{const a=D[k].meta.pressureByOver,mx=Math.max(...a.map(x=>x[1]));return`<div class="card"><b>${k==='bat'?'Batting':'Bowling'}</b><br><svg width="400" height="150" style="display:block">${a.map((x,i)=>`<rect x="${10+i*19}" y="${130-100*x[1]/mx}" width="14" height="${100*x[1]/mx}" rx="3" fill="#4a90d9" data-t="over ${x[0]+1}: ${pct(x[1])} of balls"/>`).join('')}<text x="10" y="146">over 1</text><text x="350" y="146">over 20</text></svg></div>`}).join('')+'</div>';return h}
function method(){const row=m=>{const k=m.metrics;return `<table><thead><tr><th style="text-align:left">Metric</th><th style="text-align:left">Block</th><th>Nominal weight</th><th>Share of final score it explains</th><th>Repeatability</th><th>Validity</th></tr></thead><tbody>${k.keys.map((x,i)=>`<tr><td style="text-align:left">${k.names[i]}</td><td style="text-align:left">${k.block[i]}</td><td>${f(k.weights[i]*100,0)}%</td><td>${f(m.effShare[i]*100,1)}%</td><td>${k.repeat[i]}</td><td>${k.validity[i]}</td></tr>`).join('')}</tbody></table>`};
 const sens=m=>`<table><tbody>${Object.entries(m.sens).map(([k,v])=>`<tr><td style="text-align:left">${k}</td><td>${v.o10} / 10</td></tr>`).join('')}</tbody></table>`;const aud=m=>`<table><thead><tr><th style="text-align:left">Role</th><th>Eligible</th><th>Mean score (z)</th><th>Top 10</th><th>Top 30</th></tr></thead><tbody>${Object.entries(m.audit).map(([k,v])=>`<tr><td style="text-align:left">${k}</td><td>${v.eligible}</td><td>${v.mean_z}</td><td>${v.in_top10}</td><td>${v.in_top30}</td></tr>`).join('')}</tbody></table>`;const b=D.bat.meta,w=D.bowl.meta;
 return `<div class="note"><b>Read this first.</b> Held-out validity of the composite is ${b.pred['composite (final weights)']} for batting and ${w.pred['composite (final weights)']} for bowling (Spearman; 0 = no signal). In batting almost all of the final score comes from one metric because the others cannot be separated from luck, so ranks beyond the top few are close to a tier. Weights are fixed a-priori, not fitted. Year and league views use the same weights with shrinkage fixed from the full data.</div>
 <h2>Batting metrics</h2><div class="card mini" style="overflow-x:auto">${row(b)}</div><h2>Bowling metrics</h2><div class="card mini" style="overflow-x:auto">${row(w)}</div><h2>Does the top 10 survive other choices?</h2><div class="grid2"><div class="card mini"><b>Batting</b>${sens(b)}</div><div class="card mini"><b>Bowling</b>${sens(w)}</div></div>
 <h2>Batting-position bias check</h2><div class="grid2"><div class="card mini">${aud(b)}</div></div><h2>Win-probability calibration (out-of-fold)</h2><div class="card">${cal()}</div>`}
function cal(){const w=300,h=260,m=36;return ['1','2'].map(i=>{const c=D.bat.meta.cal[i];const sx=v=>m+v*(w-m-8),sy=v=>h-m-v*(h-m-8);return `<svg width="${w}" height="${h}"><text x="${m}" y="12">Innings ${i}</text><line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" stroke="#cfd8e2"/><polyline fill="none" stroke="#2a78d6" stroke-width="2" points="${c.map(r=>sx(r[0])+','+sy(r[1])).join(' ')}"/>${c.map(r=>`<circle cx="${sx(r[0])}" cy="${sy(r[1])}" r="4" fill="#2a78d6" stroke="#fff" stroke-width="1.5" data-t="predicted ${pct(r[0])} · actual ${pct(r[1])} · n=${r[2]}"/>`).join('')}<text x="${w/2}" y="${h-6}" text-anchor="middle">predicted</text><text transform="translate(10 ${h/2}) rotate(-90)" text-anchor="middle">actual</text></svg>`}).join('')}
function render(){tabs();const v=$('#view');if(S.tab==='bat'||S.tab==='bowl'){v.innerHTML=board(S.tab);
 bind('pool',x=>{S.pool=x;render()});bind('lg',x=>{S.lg=x;S.open=null;render()});bind('pos',x=>{S.pos=x;render()});bind('pace',x=>{S.pace=x;render()});bind('show',x=>{S.show=+x;render()});
 $('#y0').onchange=e=>{S.y0=+e.target.value;if(S.y1<S.y0)S.y1=S.y0;S.open=null;render()};$('#y1').onchange=e=>{S.y1=+e.target.value;if(S.y0>S.y1)S.y0=S.y1;S.open=null;render()};
 const q=$('#q');q.oninput=e=>{S.q=e.target.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
 document.querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>{const k=t.dataset.k;if(S.sk===k)S.sd*=-1;else{S.sk=k;S.sd=(k==='rank'||k==='name'||(k==='a'&&S.tab==='bowl'))?1:-1}render()});
 document.querySelectorAll('tr.r').forEach(r=>r.onclick=()=>{const id=+r.dataset.id;S.open=S.open===id?null:id;render()})}
 else v.innerHTML=S.tab==='vs'?vs():method();document.querySelectorAll('[data-t]').forEach(el=>{if(el.tagName==='BUTTON')return;el.onmousemove=e=>tt(e,el.dataset.t);el.onmouseleave=e=>tt(e,null)})}
render();
</script></body></html>
