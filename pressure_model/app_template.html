<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who delivers when it matters? (v3)</title>
<style>
:root{--bg:#f2f8fd;--card:#fff;--ink:#1f3347;--ink2:#52677a;--mute:#8497a8;--line:#dbe8f3;--acc:#3b9ae1;--accs:#e4f2fc;--neg:#f0a58f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#e8f4fd,#f7fbfe 260px);background-color:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:26px 16px 60px}h1{font-size:27px;margin:0 0 4px;color:#17496f}.sub{color:var(--ink2);margin:0 0 18px;max-width:820px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);margin:0 8px 10px 0}
.seg button{border:0;background:none;color:var(--ink2);padding:7px 13px;font:inherit;cursor:pointer}.seg button:hover{background:var(--accs)}.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.bar{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:2px}.lab{font-size:12px;color:var(--mute);margin:0 6px 10px 0}
input[type=search]{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;width:230px;background:var(--card);color:var(--ink);margin:0 8px 10px 0}input:focus{outline:2px solid var(--acc);border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:0 2px 10px rgba(59,154,225,.07)}table{border-collapse:collapse;width:100%}
th,td{padding:10px 9px;text-align:left;border-bottom:1px solid #edf4fa;white-space:nowrap}th{font-size:12px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none;background:#fafdff}th:hover{color:var(--acc)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.r{cursor:pointer}tr.r:hover{background:#f3f9fe}tr:last-child td{border-bottom:0}.rk{font-weight:700;color:var(--acc)}.tm{color:var(--mute);font-size:12px}.up{color:#1f8a5b}.dn{color:#c2603f}
.det{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;padding:14px 8px 8px;white-space:normal}@media(max-width:760px){.det{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--accs);border-radius:12px;padding:10px 12px}.tile small{display:block;color:var(--ink2);font-size:12px}.tile b{font-size:19px;color:#17496f}.tile span{font-size:12px;color:var(--ink2)}
.pb{display:flex;align-items:center;gap:10px;margin:7px 0}.pb .l{width:200px;color:var(--ink2)}.pb .t{position:relative;flex:1;height:10px;background:#e8f1f8;border-radius:5px}.pb .t i{position:absolute;top:0;height:10px;border-radius:5px}.pb .t u{position:absolute;left:50%;top:-2px;width:1px;height:14px;background:var(--mute)}.pb .w{width:150px;font-size:12px;color:var(--ink2)}
.best{grid-column:1/-1;color:var(--ink2);font-size:13px}.h3{font-weight:600;color:#17496f;margin:0 0 6px}
.info{background:var(--accs);border:1px solid #c9e3f6;border-radius:12px;padding:10px 14px;margin:0 0 14px;color:var(--ink2)}.small{font-size:12px;color:var(--mute);margin-top:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:10px 0}summary{cursor:pointer;padding:12px 0;font-weight:600;color:#17496f}details .in{padding-bottom:14px;color:var(--ink2)}
.rng{position:relative;display:inline-block;width:110px;height:8px;background:#e8f1f8;border-radius:4px;vertical-align:middle}.rng i{position:absolute;top:0;height:8px;background:var(--acc);border-radius:4px}
</style></head><body><div class="wrap">
<h1>Who delivers when it matters?</h1>
<p class="sub" id="sub"></p>
<div id="tabs" class="seg"></div>
<div id="view"></div>
</div>
<script>
const D={bat:{all:__BAT_ALL__,act:__BAT_ACT__},bowl:{all:__BOWL_ALL__,act:__BOWL_ACT__}};
(function(){"use strict";
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=x=>(+x).toFixed(1),f2=x=>(+x).toFixed(2),sg=(x,d=1)=>(x>=0?'+':'')+(+x).toFixed(d);
const H=location.hash.slice(1);
let tab=['bat','bowl','method'].includes(H)?H:'bat',pool='all',lg='All',board='All',kind='All',size=10,open=null,q='';
const sortS={bat:{k:'rank',d:1},bowl:{k:'rank',d:1}};
const TABS=[['bat','Batters'],['bowl','Bowlers'],['method','Method & reliability']];
const PB=['Impact under pressure','Staying in & winning the game','Rises with pressure','Consistency','Protects tail-end partners'],PW=['Stopping runs','Taking wickets','Winning the game','Rises with pressure','Consistency','Discipline (wides / no-balls)'];
const SG=s=>s.startsWith('Opener')?'Opener':(s.startsWith('Finisher')||s.startsWith('Lower'))?'Finisher':'Middle order';
const word=z=>z>=1?'Elite':z>=.4?'Strong':z>-.4?'Typical':'Below typical';
function seg(el,items,get,set,after){el.innerHTML='';items.forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',String(get()===k));b.onclick=()=>{set(k);open=null;draw()};el.appendChild(b)})}
const COLS={bat:[['rank','#',p=>p.rank,1,''],['name','Batter',p=>p.name.toLowerCase(),1,''],['score','Score',p=>p.score,-1,'n'],['top','Top-10 chance',p=>p.top10p,-1,'n'],['pn','Pressure balls',p=>p.pn,-1,'n'],['sr','SR under pressure',p=>p.press.sr,-1,'n'],['edge','Impact vs expected',p=>p.impS,-1,'n'],['hit','Consistency',p=>p.hit,-1,'n']],
 bowl:[['rank','#',p=>p.rank,1,''],['name','Bowler',p=>p.name.toLowerCase(),1,''],['score','Score',p=>p.score,-1,'n'],['top','Top-10 chance',p=>p.top10p,-1,'n'],['pn','Pressure balls',p=>p.pn,-1,'n'],['ec','Econ under pressure',p=>p.press.econ,1,'n'],['edge','Impact vs expected',p=>p.impS,-1,'n'],['hit','Consistency',p=>p.hit,-1,'n']]};
function bars(z,names,wts){return names.map((n,i)=>{const v=Math.max(-3,Math.min(3,z[i])),pos=v>=0,w=wts[i];return `<div class="pb"><span class="l">${n}</span><span class="t"><u></u><i style="left:${pos?50:50+v/3*50}%;width:${Math.max(2,Math.abs(v)/3*50)}%;background:${pos?'var(--acc)':'var(--neg)'};opacity:${w>0?1:.45}"></i></span><span class="w">${word(z[i])} · ${w>0?Math.round(w*100)+'% of score':'info only'}</span></div>`}).join('')}
function tile(a,b,c){return `<div class="tile"><small>${a}</small><b>${b}</b><br><span>${c}</span></div>`}
function best(p,bat){const L=(p.best||[]).slice(0,2).map(x=>bat?`${esc(x[0])} vs ${esc(x[1])}: ${x[2]} off ${x[3]}${x[4]?' (won)':' (lost)'}`:`${esc(x[0])} vs ${esc(x[1])}: ${x[2]}/${x[3]} off ${x[4]} balls`);return L.length?`<div class="best"><b>Best ${bat?'innings':'spells'} under pressure:</b> ${L.join(' · ')}</div>`:''}
function detail(p,who){const bat=who==='bat',M=D[who][pool].meta,a=p.press,W=M.pillars.weights;
 const t=bat?tile('Strike rate under pressure',f1(a.sr),`a typical batter would score ${f1(a.esr)} · his normal play ${f1(p.norm.sr)}`)+tile('Impact vs expected',sg(p.impS,1),`runs per 100 balls, counting the runs lost when he gets out (adjusted for small samples)`)+tile('Dismissals',a.outs,`in ${p.pn} pressure balls`)
  :tile('Economy under pressure',a.econ,`a typical bowler would concede ${a.eecon}`)+tile('Impact vs expected',sg(p.impS,2),`runs per over saved vs a typical bowler, wickets valued in runs (adjusted for small samples)`)+tile('Wickets',a.wkts,`a typical bowler would take ${a.ewk}`);
 return `<div class="det"><div><div class="h3">Key numbers</div><div class="tiles">${t}${tile('Consistency',Math.round(p.hit*100)+'%',`of ${p.pinn} pressure ${bat?'innings':'spells'} helped the team`)}${tile('Likely rank',p.rlo+'–'+p.rhi,'range over 300 re-runs')}</div></div>
 <div><div class="h3">Strengths <span class="tm">(longer bar = better than a typical ${bat?'batter':'bowler'})</span></div>${bars(p.zp,bat?PB:PW,W)}</div>${best(p,bat)}</div>`}
function tauOf(M,k){const i=M.comp.keys.indexOf(k);return i<0?null:M.comp.tau[i]}
function explain(who){const bat=who==='bat',M=D[who][pool].meta,P=M.pillars,sc=P.names.map((n,i)=>[n,P.weights[i]]);
 const fmt=n=>n.replace(/\s*\(.*$/,'').replace(/:.*$/,'');
 const scored=sc.filter(x=>x[1]>0).map(x=>`<li><b>${fmt(x[0])} (${Math.round(x[1]*100)}%)</b></li>`).join(''),info=sc.filter(x=>x[1]===0).map(x=>fmt(x[0])).join(', ');
 return `<details style="margin:0 0 12px"><summary>What do these numbers mean?</summary><div class="in">
 <p><b>Pressure ball</b>: a ball where the match is on the line, for example a tight finish, a big chase, wickets falling, or a hard new-ball spell. About ${Math.round(M.pressShare*100)}% of all ${bat?'balls faced':'deliveries'} count. <b>Pressure balls</b> in the table is how many of them this player ${bat?'faced':'bowled'}.</p>
 <p><b>${bat?'SR':'Econ'} under pressure</b>: ${bat?'strike rate (runs per 100 balls)':'economy (runs conceded per over)'} on pressure balls only.</p>
 <p><b>Impact vs expected</b>: ${bat?'the batter\'s value in runs per 100 balls compared with a typical batter in the very same situations (same bowlers, over, wickets down, target, venue and partner). It counts runs scored <i>and</i> the cost of getting out: a dismissal loses every run he was expected to score from that point, so a six followed by an early dismissal scores poorly, not like a strike rate of 300.':'the bowler\'s value in runs per over compared with a typical bowler in the very same situations (same batters, overs, score, target and venue). It counts runs saved <i>and</i> wickets, each wicket valued at the runs the batter was expected to score from that point.'} It has two parts: his <b>usual level</b> (all his calm balls) and how much he <b>differs under pressure</b>. The second part is only counted as far as the data shows real, repeatable differences between players. The number is also pulled toward average when the sample is small, so a few lucky matches don't make a ranking.</p>
 <p><b>Consistency</b>: the share of his pressure ${bat?'innings':'spells'} (at least 6 pressure balls) where his team's chance of winning ended at or above what was expected. About half is typical; higher means fewer bad days when it matters.</p>
 <p><b>Top-10 chance</b>: we re-ran the whole ranking 300 times on random re-samples of the matches. This is the share of those runs in which the player finished in the top 10. 90% or more means a safe pick; 30% means he is in the mix but could easily be outside it. It measures how stable his place is, not how good he is.</p>
 <p><b>Score</b>: 50 is a typical player, and 10 points is one standard deviation. Only parts that have a clear rationale and some measurable signal are scored:</p><ul>${scored}</ul><p>Shown for information only (tested, no persistent signal between players): ${info}.</p>
 <p class="small">Likely rank = the range the player finished in for 90% of the re-runs.</p></div></details>`}
function list(who){const bat=who==='bat',M=D[who][pool].meta;let L=D[who][pool].players.filter(p=>p.elig);const N=L.length;
 if(lg==='IPL')L=L.filter(p=>p.ipl>0);else if(lg==='INT')L=L.filter(p=>p.ipl===0);
 if(bat&&board!=='All')L=L.filter(p=>SG(p.slot)===board);if(!bat&&kind!=='All')L=L.filter(p=>p.type===kind);
 const sq=q.trim().toLowerCase();if(sq)L=L.filter(p=>p.name.toLowerCase().includes(sq)||p.teams.join(' ').toLowerCase().includes(sq));
 const cols=COLS[who],S=sortS[who],get=cols.find(c=>c[0]===S.k)[2];
 L=L.slice().sort((x,y)=>{const a=get(x),b=get(y);return (a<b?-1:a>b?1:0)*S.d||x.rank-y.rank});
 const total=L.length;if(!sq&&size<999)L=L.slice(0,size);
 const boards=['Opener','Middle order','Finisher'];
 const head=cols.map(c=>`<th class="${c[4]}" data-k="${c[0]}" tabindex="0" aria-sort="${S.k===c[0]?(S.d>0?'ascending':'descending'):'none'}">${c[1]}${S.k===c[0]?(S.d>0?' ▲':' ▼'):''}</th>`).join('');
 const rows=L.map(p=>{const a=p.press,edge=p.impS;const lo=(p.rlo-1)/(N-1)*100;
  return `<tr class="r" tabindex="0" data-id="${p.id}"><td class="rk">${p.rank}</td><td style="white-space:normal;min-width:200px;max-width:300px"><b>${esc(p.name)}</b><div class="tm">${esc(p.teams.join(' / '))} · ${esc(bat?SG(p.slot):p.type)}${p.active?'':' · not active in 2026'}</div></td>
  <td class="n"><b>${f1(p.score)}</b></td><td class="n">${Math.round(p.top10p*100)}%</td><td class="n">${p.pn}</td><td class="n">${bat?f1(a.sr):a.econ}</td><td class="n ${edge>=0?'up':'dn'}">${bat?sg(p.impS,1):sg(p.impS,2)}</td><td class="n">${Math.round(p.hit*100)}%</td></tr>${open===p.id?`<tr><td colspan="8" style="background:#fbfdff">${detail(p,who)}</td></tr>`:''}`}).join('');
 $('view').innerHTML=`${explain(who)}<div class="bar"><input type="search" id="q" placeholder="Search a ${bat?'batter':'bowler'} or team" value="${esc(q)}" aria-label="Search player"><span class="lab">Players</span><div class="seg" id="pool"></div><span class="lab">League</span><div class="seg" id="lg"></div></div>
 <div class="bar">${bat?'<span class="lab">Batting position</span><div class="seg" id="bd"></div>':'<span class="lab">Bowler type</span><div class="seg" id="kd"></div>'}<span class="lab">Show</span><div class="seg" id="sz"></div></div>
 <div class="card"><table><thead><tr>${head}</tr></thead><tbody>${rows||'<tr><td colspan="8" style="padding:26px;text-align:center;color:var(--mute)">No players match these filters.</td></tr>'}</tbody></table></div>
 <p class="small">${sq?total+' match'+(total===1?'':'es'):'Showing '+L.length+' of '+total}. # is the overall rank in the chosen player pool. Score: 50 = typical, higher is better. “Impact vs expected” compares with what a typical ${bat?'batter would produce, in runs per 100 balls, counting the runs lost when he gets out':'bowler would concede, in runs per over saved, with wickets valued in runs'} in the same situations, adjusted for small samples. Consistency = share of pressure ${bat?'innings':'spells'} where the player helped his team. Click a column to sort, click a row for details.</p>`;
 seg($('pool'),[['all','All players'],['act','Active in 2026']],()=>pool,k=>pool=k);
 seg($('lg'),[['All','All'],['IPL','IPL players'],['INT','Internationals only']],()=>lg,k=>lg=k);
 if(bat)seg($('bd'),[['All','All'],...boards.map(b=>[b,b])],()=>board,k=>board=k);
 if(!bat)seg($('kd'),[['All','Pace + spin'],['Pace','Pace'],['Spin','Spin']],()=>kind,k=>kind=k);
 seg($('sz'),[[10,'Top 10'],[30,'Top 30'],[999,'All']],()=>size,k=>size=k);
 const qi=$('q');qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;draw();const n=$('q');n.focus();n.setSelectionRange(pos,pos)};
 document.querySelectorAll('th[data-k]').forEach(th=>{const go=()=>{const k=th.dataset.k;if(S.k===k)S.d=-S.d;else{S.k=k;S.d=cols.find(c=>c[0]===k)[3]}draw()};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 document.querySelectorAll('tr.r').forEach(tr=>{const go=()=>{const id=+tr.dataset.id;open=open===id?null:id;draw()};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function tbl(h,rows){return `<div class="card"><table><thead><tr>${h.map(x=>`<th style="cursor:default">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td style="white-space:normal">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function method(){const B=D.bat[pool].meta,W=D.bowl[pool].meta,cd=(M,k)=>{const t=tauOf(M,k);return t==null?'n/a':(t*100).toFixed(1)};
 const pill=M=>tbl(['Pillar','Weight in score','Repeats? (split-half)','Predicts held-out matches?'],M.pillars.names.map((n,i)=>[esc(n),M.pillars.weights[i]>0?(M.pillars.weights[i]*100).toFixed(0)+'%':'0% (information only)',f2(M.pillars.repeat[i]),f2(M.pillars.validity[i])]));
 const pred=M=>tbl(['Score design','Held-out validity'],Object.entries(M.comp.pred).filter(k=>k[0][0]!=='_').map(([k,v])=>[esc(k),f2(v)]).concat([['Composite split-half repeatability',f2(M.comp.pred._comp_repeat)]]));
 const sens=S=>tbl(['Variant','Overlap with final top 10','top 30'],Object.entries(S).map(([k,v])=>[esc(k)+(v.ens?' <span class="tm">(in ensemble)</span>':''),v.o10+' of 10',v.o30+' of 30']));
 const cal=(rows,h)=>tbl(h,rows.map(r=>r.map(x=>typeof x==='number'?(Number.isInteger(x)?x:x):esc(x))));
 const eraTxt=M=>Object.entries(M.comp.era).map(([k,v])=>{const key=Object.keys(v).find(x=>x.startsWith('chosen weights'));return k+': '+f2(v[key])}).join(' · ');
 $('view').innerHTML=`<div class="bar"><span class="lab">Players</span><div class="seg" id="pool"></div></div>
 <div class="info"><b>The main finding, and how much to trust the lists.</b> We estimate each player's <i>usual</i> level from all his calm balls, then add how much he differs under pressure, but only as far as the data supports real differences. <b>Batters:</b> the estimated true spread of "pressure minus usual" is ${cd(B,'rae_d')} runs per 100 balls (usual-level spread: ${cd(B,'rae_n')}), so there is no detectable pressure-specific skill: batters who are better in general are better under pressure, and we found no measurable "clutch" or "choke" effect. The batting ranking is mostly overall impact with a pressure-based consistency measure added. <b>Bowlers:</b> the data does show real pressure-specific differences (${cd(W,'econ_d')} runs per 100 deliveries, against ${cd(W,'econ_n')} for the usual level), so pressure counts for more in the bowling ranking, although part of this may reflect how bowling pressure is defined. Only the top 2–3 in each list are clearly separated from the pack; positions 4–10 are statistically close.</div>
 <details open><summary>What counts as pressure</summary><div class="in">A ball is a pressure ball if it is in the top 20% of the Pressure Index (win-probability swing, required rate vs venue par, wickets and depth lost, momentum), <b>or</b> it falls in a slot-specific type that exists from the first ball: <b>hard chase</b> (target ≥ 1.12× par, first 8 overs), <b>early wicket</b>, <b>elite new ball</b> (new ball vs a stingy bowler), <b>rescue</b> (3+ down by over 12, or 2+ by over 5, side the underdog), <b>last pair</b> (8+ down). Result: ${(B.pressShare*100).toFixed(0)}% of balls. Pressure share by batting position: ${B.shareOfPressureByOrder.map(x=>'#'+x[0]+' '+Math.round(x[1]*100)+'%').join(', ')}.<br><br><b>Bowling:</b> same win-probability core plus <b>death-close</b>, <b>under attack</b> (22+ off the last 12 deliveries), <b>knife-edge</b> (win chance 43–57%) and the top 15% of the Bowling Pressure Index: ${(W.pressShare*100).toFixed(0)}% of deliveries, spread fairly evenly across overs.</div></details>
 <details><summary>Batters: components, weights and reliability</summary><div class="in">${pill(B)}<p class="small">Weights are round numbers chosen by judgement: only parts with a clear rationale and some signal are scored. Slope ("vs own usual"), survival and strike protection were tested and showed no persistent signal between players (split-half ≤ 0.03), so they are shown but not scored. Consistency is scored because the brief asks for it. The data cannot separate 70/30 from 60/40, see Sensitivity. Differences between designs on held-out data are within noise, except that ignoring the cost of dismissal is clearly worse for batters.</p>${pred(B)}<p class="small">Chronological test (weights not refitted): ${eraTxt(B)}</p></div></details>
 <details><summary>Bowlers: components, weights and reliability</summary><div class="in">${pill(W)}<p class="small">Wickets are already inside impact (valued in runs), so the wickets part is information only. Discipline (wides / no-balls) repeats well but is a general bowler trait, so it is capped at 15%.</p>${pred(W)}<p class="small">Chronological test: ${eraTxt(W)}</p></div></details>
 <details><summary>Do the expected-outcome models fit? (actual vs expected)</summary><div class="in"><b>Batters, by batting position</b> (balls, strike rate actual / expected, dismissal % actual / expected)${cal(B.calib.order,['Position','Balls','SR actual','SR expected','Out % actual','Out % expected'])}<br><b>Batters, by situation</b>${cal(B.calib.situation.concat(B.calib.type),['Group','Balls','SR actual','SR expected','Out % actual','Out % expected'])}<br><b>Bowlers</b> (deliveries, economy actual / expected, wickets per over actual / expected)${cal(W.calib.phase.concat(W.calib.situation,W.calib.type),['Group','Balls','Econ actual','Econ expected','Wkts/over actual','Wkts/over expected'])}</div></details>
 <details><summary>Sensitivity: how fragile are the top 10s?</summary><div class="in"><b>Batters</b>${sens(D.bat[pool].sens)}<br><b>Bowlers</b>${sens(D.bowl[pool].sens)}<p class="small">The five variants marked “in ensemble” are averaged to produce the published rank. “Rank range” and “Top-10 chance” come from re-running that whole ensemble on 300 re-samples of the matches, with the shrinkage settings held fixed.</p></div></details>
 <details><summary>How important matches count</summary><div class="in">Every ball is weighted by how much the match mattered, from a dead rubber (about 0.75×) to a final (about 1.6×). Finals rate 1.0, semi-finals, qualifiers and eliminators 0.9, Super 4 games 0.7. IPL league games, bilateral series and the group stages of multi-team tournaments (Asia Cup, tri-series, Emerging and Rising Stars cups, qualifiers) are rated by the race: a team that has already qualified or is already out scores 0.2, a game whose result would qualify or eliminate a team scores 1.0, and a live game scores 0.65. The data has no T20 World Cup matches. Removing the weighting changes the top 10s by at most 2 players.</div></details>
 <details><summary>Data fixes and design choices</summary><div class="in"><ul><li>Missing bye / leg-bye / wide-boundary runs put back on those balls so target, runs needed and required rate agree with the result (${B.dq.chases_won} chases won; ${B.dq.target_below_recorded_chase} had recorded totals at or below the target).</li><li>Team strength is <b>pre-match</b> (previous IPL season's table, previous year-end ICC rating), with no hindsight. Win-probability accuracy: first innings AUC ${B.wp1.auc}, chase AUC ${B.wp2.auc}.</li><li>Expected outcomes depend on batting slot, partner quality (and tail-enders), target difficulty, bowler type and speed.</li><li>Dismissals are priced: a batter's dismissal costs his expected future runs; a bowler's wicket is worth the same to him.</li><li>Empirical-Bayes shrinkage: thin data is pulled toward average; a component with no real between-player spread is shrunk to zero.</li><li>Minimum ${B.minPress} pressure balls and ${B.minPinn} pressure innings; the lower-order board has lower thresholds.</li><li>Not done: super overs (38 deliveries); shot-type and delivery-style columns unused.</li></ul></div></details>`;
 seg($('pool'),[['all','All players'],['act','Active in 2026']],()=>pool,k=>pool=k)}
